kind = "web"
previewPath = "/"
title = "Gastronomy - Modern Restaurant & Reservation Platform"
version = "1.0.0"
id = "artifacts/gastronomy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22825

[services.development]
run = "pnpm --filter @workspace/gastronomy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gastronomy", "run", "build" ]
publicDir = "artifacts/gastronomy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22825"
BASE_PATH = "/"
